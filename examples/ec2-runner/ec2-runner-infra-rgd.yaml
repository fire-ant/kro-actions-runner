# EC2RunnerInfra RGD - VPC infrastructure for EC2 runners
# Creates VPC, subnet, security group, and internet gateway
# All VPC resources are automatically labeled with the scale-set name
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: ec2-runner-infra
spec:
  schema:
    apiVersion: v1alpha1
    kind: EC2RunnerInfra
    spec:
      # Scale set name - will be used to label all resources
      scaleSetName: string
      # VPC configuration
      cidrBlock: string | default = "10.0.0.0/16"
      subnetCidrBlock: string | default = "10.0.1.0/24"
  resources:
    # VPC - labeled with scale-set name
    - id: vpc
      template:
        apiVersion: ec2.services.k8s.aws/v1alpha1
        kind: VPC
        metadata:
          name: ${schema.spec.scaleSetName}-vpc
          labels:
            actions.github.com/scale-set-name: ${schema.spec.scaleSetName}
        spec:
          cidrBlocks:
            - ${schema.spec.cidrBlock}
          enableDNSSupport: true
          enableDNSHostnames: true
          tags:
            - key: Name
              value: ${schema.spec.scaleSetName}-vpc
            - key: actions.github.com/scale-set-name
              value: ${schema.spec.scaleSetName}
    # Internet Gateway
    - id: internetGateway
      template:
        apiVersion: ec2.services.k8s.aws/v1alpha1
        kind: InternetGateway
        metadata:
          name: ${schema.spec.scaleSetName}-igw
          labels:
            actions.github.com/scale-set-name: ${schema.spec.scaleSetName}
        spec:
          vpcRef:
            from:
              name: ${vpc.metadata.name}
          tags:
            - key: Name
              value: ${schema.spec.scaleSetName}-igw
    # Subnet - automatically labeled
    - id: subnet
      template:
        apiVersion: ec2.services.k8s.aws/v1alpha1
        kind: Subnet
        metadata:
          name: ${schema.spec.scaleSetName}-subnet
          labels:
            actions.github.com/scale-set-name: ${schema.spec.scaleSetName}
        spec:
          cidrBlock: ${schema.spec.subnetCidrBlock}
          vpcRef:
            from:
              name: ${vpc.metadata.name}
          tags:
            - key: Name
              value: ${schema.spec.scaleSetName}-subnet
            - key: actions.github.com/scale-set-name
              value: ${schema.spec.scaleSetName}
    # Security Group - automatically labeled
    - id: securityGroup
      template:
        apiVersion: ec2.services.k8s.aws/v1alpha1
        kind: SecurityGroup
        metadata:
          name: ${schema.spec.scaleSetName}-sg
          labels:
            actions.github.com/scale-set-name: ${schema.spec.scaleSetName}
        spec:
          name: ${schema.spec.scaleSetName}-sg
          description: Security group for ${schema.spec.scaleSetName}
          vpcRef:
            from:
              name: ${vpc.metadata.name}
          ingressRules:
            - fromPort: 22
              toPort: 22
              ipProtocol: tcp
              ipRanges:
                - cidrIP: "0.0.0.0/0"
                  description: "SSH access"
          egressRules:
            - ipProtocol: "-1"
              ipRanges:
                - cidrIP: "0.0.0.0/0"
                  description: "Allow all outbound"
          tags:
            - key: Name
              value: ${schema.spec.scaleSetName}-sg
            - key: actions.github.com/scale-set-name
              value: ${schema.spec.scaleSetName}
