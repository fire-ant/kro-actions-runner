# Example: Complete setup with AutoScalingRunnerSet + VPCNetwork + EC2Runners
#
# Architecture:
# 1. Deploy AutoScalingRunnerSet (defines the scale set)
# 2. Create VPCNetworkARC (references the scale set, gets labeled automatically)
# 3. EC2Runners discover VPC by scale-set-name label
#
# Benefits:
# - VPC automatically labeled with scale-set name
# - No manual name matching required
# - One VPC per scale set
# - Infrastructure tied to ARC configuration
# Step 1: Create AutoScalingRunnerSet
# (In production, install via Helm: gha-runner-scale-set chart)
apiVersion: v1
kind: Secret
metadata:
  name: my-runners-github-secret
  namespace: arc-runners
type: Opaque
stringData:
  github_token: "ghp_your_token_here"
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: my-runners
  namespace: arc-runners
spec:
  githubConfigUrl: "https://github.com/my-org/my-repo"
  githubConfigSecret: my-runners-github-secret
  minRunners: 3
  maxRunners: 10
---
# Step 2: Create VPCNetwork that references the AutoScalingRunnerSet
# This automatically creates VPC resources with labels: actions.github.com/scale-set-name=my-runners
apiVersion: kro.run/v1alpha1
kind: VPCNetworkARC
metadata:
  name: my-runners-vpc
  namespace: arc-runners
spec:
  autoScalingRunnerSetName: my-runners
  autoScalingRunnerSetNamespace: arc-runners
  cidrBlock: "10.0.0.0/16"
  subnetCidrBlock: "10.0.1.0/24"

# Step 3: EC2Runners automatically discover the VPC by scale-set name
# When runner pods start, kar creates EC2Runner resources that reference
# the VPC resources by the scale-set name (inherited from AutoScalingRunnerSet)
#
# No additional configuration needed!
# The EC2Runner RGD finds VPC resources with label: actions.github.com/scale-set-name=my-runners
---

